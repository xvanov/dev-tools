<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis · Ask</title>
<link rel="stylesheet" href="theme.css">
<script src="nav.js" data-layer="talk"></script>
<style>
  /* Colours, type and the layer switcher come from theme.css (the Jarvis design
     system); only this page's layout lives here. */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--surface-0);
    color: var(--ink);
    font: var(--text-base)/var(--leading) var(--font-sans);
    user-select: none;
    -webkit-user-select: none;
  }
  /* The one thing: the face, centred in everything under the header. */
  main {
    min-height: 100dvh;
    padding: var(--gutter);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-3);
  }
  /* The face is the assistant: drawn in the mono voice, in ink at rest, in the
     signal colour while it listens, amber when something is wrong. */
  #face {
    font: 22px/1.15 var(--font-mono);
    margin: 0;
    white-space: pre;
    cursor: pointer;
    color: var(--ink);
    transition: color .3s, text-shadow .3s;
  }
  #face[data-expr="listening"], #face[data-expr="awake"] { color: var(--signal); text-shadow: 0 0 18px var(--signal-soft); }
  #face[data-expr="asleep"] { color: var(--ink-3); }
  #face[data-expr="concerned"] { color: var(--amber); }
  @media (max-width: 420px) { #face { font-size: 17px; } }
  #mood { font: var(--text-sm)/1 var(--font-mono); color: var(--ink-3); height: 1em; }
  #activity { font-size: var(--text-sm); color: var(--ink-2); min-height: 1.4em; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #caption { min-height: 2.9em; text-align: center; font-size: var(--text-lg); line-height: 1.4; max-width: 34em; }
  #heard { min-height: 1.4em; text-align: center; font-size: 13px; color: var(--ink-2); font-style: italic; }
  #notice { font-size: 13px; color: var(--amber); text-align: center; min-height: 1.2em; max-width: 34em; }
  #ptt {
    margin-top: 6px;
    border: 1px solid var(--line-strong);
    background: var(--surface-1);
    color: var(--ink-2);
    border-radius: var(--radius-pill);
    padding: 10px 22px;
    font: 500 var(--text-sm)/1.2 var(--font-mono);
    cursor: pointer;
    touch-action: none;
    box-shadow: var(--shadow-1);
  }
  #ptt:hover { border-color: var(--signal); }
  /* Phones: hold-to-talk is the main control, so it is a thumb-sized target. */
  @media (pointer: coarse) { #ptt { padding: 22px 44px; font-size: var(--text-md); -webkit-touch-callout: none; } }
  #tapPrompt {
    border: 1px solid var(--signal);
    background: var(--signal);
    color: var(--on-signal);
    border-radius: var(--radius-pill);
    padding: 12px 26px;
    font: 600 var(--text-md)/1.2 var(--font-sans);
    cursor: pointer;
    box-shadow: var(--shadow-1);
  }
  #ptt.down { color: var(--on-signal); background: var(--signal); border-color: var(--signal); }
  /* The settings panel (theme.css .jside): one control per row, its label above. */
  .talk-settings { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; font-size: 13px; }
  .talk-settings > label, .talk-settings > .lbl { color: var(--ink-2); margin-top: 8px; }
  .talk-settings > label:first-child { margin-top: 0; }
  #settings select, #settings input[type=range] { width: 100%; max-width: 100%; accent-color: var(--signal); }
  #settings input[type=checkbox] { accent-color: var(--signal); }
  #settings select { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 6px; font: inherit; }
  #settings input[type=range]#endMs { width: 70%; }
  #debug { width: 100%; max-width: 640px; margin: 8px 0 0; font: 11px/1.4 var(--font-mono); color: var(--ink-2); white-space: pre-wrap; user-select: text; }
  #settings .meter { height: 4px; background: var(--surface-2); border-radius: 2px; position: relative; overflow: hidden; }
  #settings .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--signal); width: 0; }
  #settings .meter b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--amber); left: 0; }
</style>
</head>
<body>
<h1 class="sr-only">Ask</h1>
<!-- Kept for talk.page.js, which wires #toSession; the panel's navigation replaces both. -->
<span hidden>
  <a id="toDashboard" href="./">dashboard</a>
  <button id="toSession" type="button">session</button>
</span>
<div class="jframe">
<aside class="jside" id="settings" data-jside aria-label="Voice, microphone and listening settings">
<div class="talk-settings">
  <label for="ttsBackend">Speech engine</label><select id="ttsBackend"></select>
  <label for="voice">Voice</label><select id="voice"></select>
  <label for="wake">Wake word</label><span><input type="checkbox" id="wake"> listen for "hey Jarvis" (heard in this page only)</span>
  <label for="handsFree">Hands-free</label><span><input type="checkbox" id="handsFree"> listen without holding Space</span>
  <label for="smartTurn">Smart end of turn</label><span><input type="checkbox" id="smartTurn"> answer as soon as I sound finished</span>
  <label for="deafWhileTalking">While I talk</label><span><input type="checkbox" id="deafWhileTalking"> stop listening (no barge-in)</span>
  <label for="muted">Voice off</label><span><input type="checkbox" id="muted"> show answers, do not speak them</span>
  <label for="endMs">Pause before sending</label><span><input type="range" id="endMs" step="50"> <span id="endMsLabel"></span></span>
  <label for="voiceMode">Speak while working</label><select id="voiceMode"><option value="auto">only on slow turns (over 4 s)</option><option value="all">every step</option><option value="final">only the answer</option></select>
  <label for="sensitivity">Mic threshold</label><input type="range" id="sensitivity" min="0.003" max="0.06" step="0.001">
  <span class="lbl">Level</span><div class="meter"><i id="levelBar"></i><b id="threshMark"></b></div>
</div>
</aside>
<main class="jmain">
  <div id="mood"></div>
  <pre id="face" role="img" aria-label="assistant face" title="Tap to start"></pre>
  <div id="activity"></div>
  <div id="caption"></div>
  <div id="heard"></div>
  <div id="notice"></div>
  <button id="tapPrompt" type="button" hidden>Tap once to enable Jarvis</button>
  <button id="ptt" type="button">hold Space (or here) to talk</button>
  <pre id="debug" hidden title="latency per turn (?debug=1)"></pre>
</main>
</div>
<script src="talk.core.js"></script>
<script src="talk.capture.js"></script>
<script src="talk.voice.js"></script>
<script src="talk.page.js"></script>
</body>
</html>
