<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis · Build</title>
<link rel="stylesheet" href="theme.css">
<script src="nav.js" data-layer="factory"></script>
<style>
  /* Colours, type and the layer switcher come from theme.css (the Jarvis design
     system); only this page's layout lives here. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--ink);
    font: var(--text-base)/var(--leading) var(--font-sans); }
  .meta { color: var(--ink-2); font-size: var(--text-sm); }
  .meta.bad { color: var(--bad); }

  .spend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { background: var(--surface-2); border-radius: var(--radius); padding: 6px 8px; display: flex; flex-direction: column; min-width: 0; }
  .stat b { font: 600 var(--text-md)/1.2 var(--font-mono); }
  .stat span { color: var(--ink-2); font-size: var(--text-xs); }

  .new > summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .new form { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); margin: 10px 0 4px; }
  .new label { display: flex; flex-direction: column; gap: 3px; font-size: var(--text-sm); color: var(--ink-2); }
  .new input, .new textarea, .new select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 5px 8px; }
  .new textarea { min-height: 84px; resize: vertical; }
  .new .row { display: flex; gap: 8px; align-items: center; }

  /* The one thing: the agents' runs, across the whole width. */
  main { display: grid; gap: 16px; padding: var(--jtop) var(--gutter) var(--gutter); grid-template-columns: minmax(0, 1fr); align-items: start; }
  section { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 14px; box-shadow: var(--shadow-1); }
  section h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  section h2 .n { color: var(--ink-2); font: 500 var(--text-sm) var(--font-mono); margin-left: 6px; }
  section.needs_you { border-color: var(--amber); }
  section.needs_you h2 { color: var(--amber); }
  .empty { color: var(--ink-3); font-size: var(--text-sm); }
  .runsec { display: grid; gap: 0; }

  .job { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 8px; }
  .job:first-of-type { border-top: 0; }
  .job .t { font-weight: 550; overflow-wrap: anywhere; }
  .mono { font-family: var(--font-mono); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--surface-2); border-radius: var(--radius-pill); padding: 1px 8px; font-size: var(--text-xs); color: var(--ink-2); }
  .chip.mono { font-family: var(--font-mono); }
  .chip.s-needs_human, .chip.s-waiting { color: var(--amber); background: var(--amber-soft); }
  .chip.s-failed, .chip.s-stopped { color: var(--bad); }
  .chip.s-done { color: var(--ok); }
  .chip.s-running, .chip.s-starting { color: var(--signal); }
  .why { color: var(--ink-2); font-size: var(--text-sm); border-left: 2px solid var(--line); padding-left: 8px; overflow-wrap: anywhere; }
  .why.err { border-left-color: var(--bad); color: var(--bad); }
  .why.result { border-left-color: var(--ok); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn, button { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; text-decoration: none; }
  button.primary { background: var(--signal); color: var(--on-signal); border-color: transparent; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  button.linkish { border: 0; background: none; color: var(--signal); padding: 0 4px; font-size: var(--text-sm); }
  button.linkish.cur { font-weight: 700; color: var(--ink); }
  .row { display: flex; gap: 8px; align-items: center; }
  .replyin { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 5px 8px; }
  .askbox { border: 1px solid var(--amber); border-radius: var(--radius); padding: 8px; display: grid; gap: 6px; background: var(--amber-soft); }
  .bpager { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }

  /* The timeline: one lane per agent. A bar pulses only while its agent works;
     an ended agent's is static. A tick is one tool call (red when it failed). */
  .trace { border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .lane { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 8px; align-items: center; }
  .lname { font: 600 var(--text-xs) var(--font-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { position: relative; height: 22px; background: var(--surface-2); border-radius: var(--radius-sm); overflow: hidden; }
  .blk { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; background: var(--ok); opacity: .55; min-width: 4px; }
  .blk.failed { background: var(--bad); }
  .blk.running { background: var(--signal); opacity: .8; animation: bpulse 1.4s ease-in-out infinite; }
  .tick { position: absolute; top: 1px; bottom: 1px; width: 2px; background: var(--ink); opacity: .7; }
  .tick.err { background: var(--bad); opacity: 1; width: 3px; }
  @keyframes bpulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .blk.running { animation: none; } }

  .calls > summary { cursor: pointer; font-size: var(--text-sm); color: var(--ink-2); }
  ul.steps, ul.msgs { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
  ul.steps li { display: flex; gap: 8px; align-items: baseline; min-width: 0; font-size: 12px; }
  .tname { font: 600 12px var(--font-mono); flex: none; }
  .targ { font: 12px var(--font-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tres { flex: none; font-weight: 700; } .tres.ok { color: var(--ok); } .tres.err { color: var(--bad); } .tres.pending { color: var(--ink-3); }
  ul.msgs { border-top: 1px solid var(--line); padding-top: 6px; gap: 6px; }
  .msg .mt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
  .msg .ans { color: var(--ink-2); }
  .msg.k-ask .mt { font-weight: 550; }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink);
    color: var(--surface-0); padding: 8px 14px; border-radius: var(--radius); font-size: 13px; opacity: 0;
    transition: opacity .2s var(--ease); pointer-events: none; max-width: 90vw; z-index: 40; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<h1 class="sr-only">Build</h1>
<aside class="jside" id="factory-settings" data-jside aria-label="Build settings">
<div>
  <h2>Status</h2>
  <span class="meta" id="updated">loading…</span>
</div>
<div>
  <h2>Agents</h2>
  <div class="spend" id="spend"></div>
</div>
<details class="new" id="newjob" open>
  <summary>New run</summary>
  <form id="newform" autocomplete="off">
    <label>Task<textarea name="task" required placeholder="What should the agent do?"></textarea></label>
    <label>Model<select name="model"><option value="haiku">haiku</option><option value="sonnet" selected>sonnet</option><option value="opus">opus</option></select></label>
    <label>Repo (optional, a checkout path)<input name="repo" type="text" placeholder="C:\repos\…"></label>
    <div class="row"><button class="primary" type="submit">Start</button><span class="meta" id="newhint"></span></div>
  </form>
</details>
</aside>
<main id="board" class="jmain" data-permission-card></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="events.js"></script>
<!-- Jarvis's permission prompt (e.g. its build_reply), answerable here too.
     Before build-board.js, which takes the page token out of the DOM. -->
<script src="login.js"></script>
<script src="permission.js"></script>
<script src="build-board.js"></script>
</body>
</html>
