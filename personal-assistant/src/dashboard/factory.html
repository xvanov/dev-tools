<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis · Factory</title>
<link rel="stylesheet" href="theme.css">
<script src="nav.js" data-layer="factory"></script>
<style>
  /* Colours, type and the layer switcher come from theme.css (the Jarvis design
     system); only this page's layout lives here. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--ink);
    font: var(--text-base)/var(--leading) var(--font-sans); }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 20px 6px; }
  header > .jnav { flex: 1 0 100%; }
  header h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
  .meta { color: var(--ink-2); font-size: var(--text-sm); }
  .meta.bad { color: var(--bad); }

  /* The spend line: today's PA model spend, the factory's metered spend and
     what its Claude Code runs would have cost at API prices. */
  .spend { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 20px 12px; }
  .stat { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px;
    display: flex; flex-direction: column; min-width: 150px; box-shadow: var(--shadow-1); }
  .stat b { font: 600 var(--text-lg)/1.2 var(--font-mono); }
  .stat span { color: var(--ink-2); font-size: var(--text-xs); }

  .new { margin: 0 20px 14px; background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 8px 14px; box-shadow: var(--shadow-1); }
  .new > summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .new form { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin: 10px 0 4px; }
  .new label { display: flex; flex-direction: column; gap: 3px; font-size: var(--text-sm); color: var(--ink-2); }
  .new label.wide { grid-column: 1 / -1; }
  .new input, .new textarea, .new select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 5px 8px; }
  .new textarea { min-height: 84px; resize: vertical; }
  .new .row { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }

  main { display: grid; gap: 16px; padding: 0 20px 24px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
  section { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 14px; box-shadow: var(--shadow-1); }
  section h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  section h2 .n { color: var(--ink-2); font: 500 var(--text-sm) var(--font-mono); margin-left: 6px; }
  section.needs_you { border-color: var(--amber); }
  section.needs_you h2 { color: var(--amber); }
  .empty { color: var(--ink-3); font-size: var(--text-sm); }

  .job { border-top: 1px solid var(--line); padding: 10px 0; }
  .job:first-of-type { border-top: 0; }
  .job .t { font-weight: 550; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { background: var(--surface-2); border-radius: var(--radius-pill); padding: 1px 8px; font-size: var(--text-xs); color: var(--ink-2); }
  .chip.mono { font-family: var(--font-mono); }
  .chip.k-research, .chip.k-report { color: var(--signal); }
  .chip.r-claude_session { color: var(--ok); }
  .chip.s-needs_human, .chip.s-blocked, .chip.ci-failing { color: var(--amber); background: var(--amber-soft); }
  .chip.s-failed { color: var(--bad); }
  .chip.s-done, .chip.ci-passing { color: var(--ok); }
  .why { color: var(--ink-2); font-size: var(--text-sm); margin-top: 4px; border-left: 2px solid var(--line); padding-left: 8px; }
  .job.needs_you .why { border-left-color: var(--amber); }
  .stories, .runs { list-style: none; margin: 6px 0 0; padding: 0; font-size: var(--text-sm); }
  .stories li, .runs li { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 1px 0; color: var(--ink-2); }
  a { color: var(--signal); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .cost { color: var(--ink-2); font: var(--text-xs) var(--font-mono); margin-top: 4px; }
  .excerpt { margin-top: 6px; font-size: 13px; white-space: pre-wrap; max-height: 7.5em; overflow: hidden;
    background: var(--surface-2); border-radius: var(--radius-sm); padding: 6px 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  details.more { margin-top: 4px; font-size: var(--text-sm); }
  details.more > summary { cursor: pointer; color: var(--ink-2); }

  button { font: inherit; font-size: 12px; border: 1px solid var(--line-strong); background: var(--surface-1);
    color: var(--ink); border-radius: var(--radius); padding: 3px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--signal); }
  button.primary { background: var(--signal); border-color: var(--signal); color: var(--on-signal); font-weight: 600; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }

  /* Read report: a sheet over the page. */
  .sheet { position: fixed; inset: 0; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start;
    padding: 5vh 16px; z-index: 30; }
  .sheet[hidden] { display: none; }
  .sheet .paper { background: var(--surface-1); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); width: min(860px, 100%);
    max-height: 90vh; overflow: auto; padding: 16px 22px; }
  .sheet .bar { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .md h3, .md h4, .md h5 { margin: 14px 0 6px; }
  .md p { margin: 6px 0; }
  .md pre, .md code { font: 12px/1.4 var(--font-mono); background: var(--surface-2); border-radius: var(--radius-sm); }
  .md pre { padding: 8px; overflow: auto; white-space: pre-wrap; }
  .md code { padding: 0 4px; }
  .md blockquote { margin: 6px 0; padding-left: 10px; border-left: 2px solid var(--line); color: var(--ink-2); }
  .md li.d1 { margin-left: 16px; } .md li.d2 { margin-left: 32px; }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink);
    color: var(--surface-0); padding: 8px 14px; border-radius: var(--radius); font-size: 13px; opacity: 0;
    transition: opacity .2s var(--ease); pointer-events: none; max-width: 90vw; z-index: 40; }
  #toast.show { opacity: 1; }
  @media (max-width: 560px) { main, .spend { padding-left: 10px; padding-right: 10px; } .new { margin: 0 10px 12px; } }
</style>
</head>
<body>
<header>
  <div data-jnav></div>
  <h1>Factory</h1>
  <span class="meta" id="updated">loading…</span>
</header>
<div class="spend" id="spend"></div>
<details class="new" id="newjob">
  <summary>New job</summary>
  <form id="newform" autocomplete="off">
    <label class="wide">Title <input name="title" maxlength="200" required placeholder="What is it, in a few words"></label>
    <label class="wide">Ask <textarea name="ask" placeholder="What you want, in your own words — the builder sees only this"></textarea></label>
    <label>Kind <select name="kind"></select></label>
    <label>Runtime <select name="runtime"></select></label>
    <label>Repo <input name="repo" placeholder="owner/name (optional for research/report)"></label>
    <label data-code>End state <select name="delivery"></select></label>
    <label class="wide">Done when / questions (one per line) <textarea name="done" placeholder="optional"></textarea></label>
    <div class="row"><button class="primary" type="submit">Start job</button><span class="meta" id="newhint"></span></div>
  </form>
</details>
<main id="board"></main>
<div class="sheet" id="sheet" hidden>
  <div class="paper" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="bar"><h2 id="sheet-title">Report</h2><button type="button" id="sheet-close">Close</button></div>
    <div class="meta" id="sheet-meta"></div>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="factory.js"></script>
</body>
</html>
