<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis · Turn log</title>
<link rel="stylesheet" href="theme.css">
<script src="nav.js" data-layer="dashboard"></script>
<style>
  /* Colours and type come from theme.css; only this page's layout lives here.
     The content is GET /api/turns (src/chat/turnLog.ts), rendered by
     turns.client.js with textContent only. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--ink);
    font: var(--text-base)/var(--leading) var(--font-sans); }
  header { padding: var(--jtop) 16px 4px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: var(--text-xl); margin: 4px 0 2px; }
  .intro { color: var(--ink-2); margin: 0 0 10px; }
  main { max-width: 1000px; margin: 0 auto; padding: 0 16px 40px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 0 0 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-pill); overflow: hidden; background: var(--surface-1); }
  .seg button { font: inherit; font-size: var(--text-sm); border: 0; background: transparent; color: var(--ink-2); padding: 5px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--signal); color: var(--on-signal); }
  input[type=search] { font: inherit; font-size: var(--text-sm); padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--radius-pill);
    background: var(--surface-1); color: var(--ink); min-width: 0; flex: 1 1 180px; max-width: 320px; }
  .turn { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-1); padding: 10px 14px; margin-bottom: 10px; }
  .turn.s-error { border-color: var(--bad); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: var(--text-xs); color: var(--ink-2); margin-bottom: 6px; }
  .meta .st-open { color: var(--amber, var(--ink)); }
  .meta .st-error { color: var(--bad); }
  .line { display: grid; grid-template-columns: 4.5em 1fr; gap: 8px; margin: 3px 0; overflow-wrap: anywhere; }
  .line > b { font-size: var(--text-xs); color: var(--ink-2); font-weight: 600; padding-top: 2px; }
  .line.you > span { font-weight: 600; }
  .line.chat > span { white-space: pre-wrap; }
  .route { font-size: var(--text-sm); }
  .bars { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; }
  .pbar { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); font-family: var(--font-mono); color: var(--ink-2); }
  .pbar i { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .pbar i em { display: block; height: 100%; background: var(--signal); }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 0 8px; font-size: var(--text-xs); color: var(--ink-2); margin: 2px 4px 0 0; }
  details { margin-top: 6px; font-size: var(--text-sm); }
  details pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: var(--text-xs); background: var(--surface-0);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0 0; }
  .more { display: block; margin: 10px auto; font: inherit; padding: 6px 16px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface-1); color: var(--ink); cursor: pointer; }
  .muted { color: var(--ink-2); }
  @media (max-width: 560px) { .line { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>
<body>
<header>
  <h1>Turn log</h1>
  <p class="intro">Everything said to Jarvis, by voice, typed or the inbox doorbell: how the fast lane routed it, what it said, and the PA chat's answer and tools. Stored in Jarvis's own database for PA_TURN_LOG_DAYS days. <span class="muted">CLI: pa turns</span></p>
</header>
<main>
  <div class="bar">
    <div class="seg" id="channel" role="group" aria-label="Channel">
      <button data-v="" aria-pressed="true">All</button><button data-v="voice" aria-pressed="false">Voice</button><button data-v="typed" aria-pressed="false">Typed</button><button data-v="doorbell" aria-pressed="false">Doorbell</button>
    </div>
    <div class="seg" id="route" role="group" aria-label="Route">
      <button data-v="" aria-pressed="true">Any route</button><button data-v="answer" aria-pressed="false">Answered here</button><button data-v="handoff" aria-pressed="false">Handed off</button>
    </div>
    <input type="search" id="q" placeholder="Search words and answers" aria-label="Search">
  </div>
  <div id="list" aria-live="polite"></div>
  <button class="more" id="more" hidden>Older</button>
</main>
<script src="turns.client.js"></script>
</body>
</html>
