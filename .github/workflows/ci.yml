name: ci

# One workflow, path-filtered per tool. A `changes` job decides which tools a
# push/PR touched; each tool's jobs run on Linux and Windows in parallel (plan D14:
# no macOS).
# workflow_dispatch (and any change to this file) runs everything.
# No secrets are used or needed: tests run against local fixtures only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A shared group also cancels *pending* runs, so only PRs share one; every
  # push/dispatch gets a unique group and its own verdict.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Only supersede stale PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pa: ${{ steps.f.outputs.pa }}
      termhub: ${{ steps.f.outputs.termhub }}
      factory: ${{ steps.f.outputs.factory }}
      ios: ${{ steps.f.outputs.ios }}
      ptyd: ${{ steps.f.outputs.ptyd }}
      build: ${{ steps.f.outputs.build }}
      jarvisd: ${{ steps.f.outputs.jarvisd }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          all() { for k in pa termhub factory ios ptyd build jarvisd; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          [ "$EVENT" = "workflow_dispatch" ] && all
          if [ "$EVENT" = "pull_request" ]; then BASE="$BASE_PR"; else BASE="$BEFORE"; fi
          # New branch / forced push / unknown base: run everything (fail safe).
          if [ -z "$BASE" ] || echo "$BASE" | grep -qE '^0+$' || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then all; fi
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          echo "$CHANGED" | grep -q '^\.github/workflows/ci\.yml$' && all
          hit() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }
          # schemas/ is the PA <-> factory contract (plan 1.1): both sides test against it.
          echo "pa=$(hit '^(personal-assistant|schemas)/')" >> "$GITHUB_OUTPUT"
          echo "termhub=$(hit '^termhub/')" >> "$GITHUB_OUTPUT"
          echo "factory=$(hit '^(software-factory|schemas)/')" >> "$GITHUB_OUTPUT"
          echo "ios=$(hit '^ios-messages/')" >> "$GITHUB_OUTPUT"
          # The conformance suite holds ptyd to sessiond's protocol: a change to either side reruns it.
          echo "ptyd=$(hit '^(ptyd|termhub)/')" >> "$GITHUB_OUTPUT"
          # Everything scripts/build.js compiles (T7): ptyd and the desktop shell (7.6).
          echo "build=$(hit '^(ptyd|desktop)/|^scripts/build\.js$')" >> "$GITHUB_OUTPUT"
          echo "jarvisd=$(hit '^(jarvisd|scripts/build\.js)')" >> "$GITHUB_OUTPUT"

  personal-assistant:
    needs: changes
    if: needs.changes.outputs.pa == 'true'
    name: personal-assistant (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: personal-assistant
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy.test.js dry-runs the redeploy wrapper from HEAD~1.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: personal-assistant/package-lock.json
      # Bun / cargo+sccache caches arrive with phases 1 and 5 (plan T6/T7).
      - run: npm ci
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh npm test
        shell: bash

  # The repository contract (plan 1.3) against a real Postgres: the only PA test
  # that needs one. Service containers run on Linux runners only, so it is its own
  # job; in the matrix job above repoContract.test.js finds no server and skips
  # Postgres. Its SQLite run (plan 3.2) needs no service: it runs in both jobs,
  # so on Linux and Windows.
  personal-assistant-contract:
    needs: changes
    if: needs.changes.outputs.pa == 'true'
    name: personal-assistant contract (postgres, sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pa
          POSTGRES_PASSWORD: pa
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pa"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: personal-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: personal-assistant/package-lock.json
      - run: npm ci
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh node test/repoContract.test.js
        shell: bash
        env:
          PA_TESTING: '1'
          PA_DATABASE_URL: postgres://pa:pa@127.0.0.1:1/blocked_in_tests
          PA_TEST_PG_URL: postgres://pa:pa@127.0.0.1:5432/postgres
      # pa db export --to sqlite (plan 3.3): Postgres into a new SQLite file.
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh node test/dbExport.test.js
        shell: bash
        env:
          PA_TESTING: '1'
          PA_DATABASE_URL: postgres://pa:pa@127.0.0.1:1/blocked_in_tests
          PA_TEST_PG_URL: postgres://pa:pa@127.0.0.1:5432/postgres
      # The same contract on Postgres under Bun (plan 4.1): jarvisd runs this code.
      - run: npm ci
        working-directory: jarvisd
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh ../jarvisd/node_modules/bun/bin/bun.exe test/repoContract.test.js
        shell: bash
        env:
          PA_TESTING: '1'
          PA_DATABASE_URL: postgres://pa:pa@127.0.0.1:1/blocked_in_tests
          PA_TEST_PG_URL: postgres://pa:pa@127.0.0.1:5432/postgres
          PA_CONTRACT_BACKENDS: postgres

  # jarvisd (plan 4.1): strict typecheck, the PA's test files that jarvisd absorbs
  # first run under Bun unchanged (scripts/parity.js), and the compiled
  # executable's --check, on both OSes.
  jarvisd:
    needs: changes
    if: needs.changes.outputs.pa == 'true' || needs.changes.outputs.jarvisd == 'true'
    name: jarvisd (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jarvisd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            jarvisd/package-lock.json
            personal-assistant/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: personal-assistant
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh npm test
        shell: bash
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh node ../scripts/build.js --only jarvisd
        shell: bash
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh ./dist/jarvisd --check
        shell: bash

  termhub:
    needs: changes
    if: needs.changes.outputs.termhub == 'true'
    name: termhub (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: termhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: termhub/package-lock.json
      - run: npm ci
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh npm test
        shell: bash

  # ptyd (plan 5.1): the Rust terminal host. Lint, unit tests, then the termhub
  # protocol conformance suite against the built binary (sessiond, ptyd and
  # sessiond-on-ptyd legs; PTYD_REQUIRED=1 makes a missing binary a failure,
  # where the termhub job above SKIPs those legs) and the sessiond-restart test.
  # Compiles go through sccache (GitHub cache backend); rust-cache keeps the
  # cargo registry and git deps.
  ptyd:
    needs: changes
    if: needs.changes.outputs.ptyd == 'true'
    name: ptyd (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ptyd
          cache-targets: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: termhub/package-lock.json
      - name: cargo fmt / clippy / test / build
        working-directory: ptyd
        shell: bash
        run: |
          set -e
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
          sccache --show-stats || true
      - run: npm ci
        working-directory: termhub
      - name: conformance (sessiond, ptyd, sessiond+ptyd)
        working-directory: termhub
        shell: bash
        env:
          PTYD_REQUIRED: '1'
          CONFORMANCE_TRACE: '1'
        run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh node test/ptydConformance.test.js
      - name: sessiond restart keeps terminals (TERMHUB_PTYD=1)
        working-directory: termhub
        shell: bash
        env:
          PTYD_REQUIRED: '1'
        run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh node test/ptydBackend.test.js

  # Build pipeline (plan T7): `node scripts/build.js` builds every compiled target
  # (ptyd; the Tauri desktop shell's installers, plan 7.6: NSIS on Windows, .deb
  # on Linux; jarvisd's `bun build --compile` joins with plan 4.1) per OS in
  # parallel, release profile, and dist/<os>-<arch>/ (binaries, installers and a
  # manifest.json with sha256) is published as a build artifact. The desktop
  # crate's fmt/clippy/unit tests run here, since on Linux they need WebKitGTK.
  # Signing hook: DEVTOOLS_SIGN_CMD (plan 7.4), unset here.
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ptyd
            desktop/src-tauri
          cache-targets: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
        working-directory: desktop
      - name: desktop fmt / clippy / unit tests
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -e
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh node scripts/build.js --release
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  software-factory:
    needs: changes
    if: needs.changes.outputs.factory == 'true'
    name: software-factory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Informational for now on every OS (a red leg is visible but does not fail the
    # run): 38 factory tests need content this public repo does not track
    # (apps/sacrifice, bench/swebench) and the factory is POSIX-only until phase 2.3.
    # Flip to `matrix.os != 'ubuntu-latest'` once T3 skips those tests, and to false
    # after 2.3. See PLAN.md T6 follow-ups.
    continue-on-error: true
    timeout-minutes: 25
    defaults:
      run:
        working-directory: software-factory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: software-factory/uv.lock
          python-version: "3.12"
      - name: bubblewrap for the agent sandbox tests (plan 5.2)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bwrap needs them.
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --all-extras
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh uv run pytest -q --tb=short -n auto --dist loadfile
        shell: bash

  ios-messages:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: ios-messages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios-messages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ios-messages/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: bash $GITHUB_WORKSPACE/.github/scripts/run.sh python -m pytest -q tests
        shell: bash
