[package]
name = "jarvis-desktop"
version = "0.1.0"
edition = "2021"
description = "Jarvis desktop shell (plan 7.6): the stack's browser shell in its own window, with tray, notifications and a stack switcher."
license = "MIT"
publish = false

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true

# scripts/build.js --local: release-speed code, incremental, no LTO (see ptyd).
[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
