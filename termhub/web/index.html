<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>termhub</title>
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <div id="scrim"></div>

    <aside id="sidebar">
      <div class="sidebar-head">
        <span class="brand">termhub</span>
        <span id="machine-name" class="machine-name">…</span>
        <button id="update-btn" title="Check for updates">⟳ Update</button>
        <button id="sidebar-collapse" title="Collapse sidebar">&laquo;</button>
        <button id="sidebar-close" title="Close">✕</button>
      </div>
      <div id="version-line" title="current version"></div>
      <div class="actions">
        <button id="new-term-btn">+ New terminal</button>
      </div>
      <div id="session-list"></div>
      <div class="sidebar-foot"><span id="status-line">connecting…</span></div>
    </aside>

    <!-- Shown only on desktop while the sidebar is collapsed — the sidebar
         itself is gone, so this floating button is the only way back. -->
    <button id="sidebar-expand" title="Show sidebar">&raquo;</button>

    <main id="main">
      <div id="topbar">
        <button id="menu-btn" title="Menu">☰</button>
        <span id="active-title">termhub</span>
        <button id="topbar-new" title="New terminal">＋</button>
      </div>

      <!-- Shown only on desktop while the active terminal runs a full-screen
           mouse-mode app (Claude Code, vim, less), where a plain drag is sent to
           the app instead of selecting text. Explains the Shift-to-select trick. -->
      <div id="mouse-hint" class="hidden">
        <span>Full-screen app: hold <kbd>Shift</kbd> and drag to select, then <kbd>Ctrl/⌘</kbd>+<kbd>C</kbd> to copy to your local clipboard.</span>
        <button id="mouse-hint-dismiss" title="Don't show again">✕</button>
      </div>

      <div id="terminals">
        <div id="empty-state">
          <p>No terminal open.</p>
          <p>Tap <strong>＋</strong> or open the menu (<strong>☰</strong>) to start one.</p>
        </div>
      </div>

      <!-- Voice strip. Sits directly above the key bar because the only reason
           to look at it in a hurry is to hit Cancel during the undo window, and
           that wants to be under your thumb. Hidden entirely until voice is in
           play, so it costs nothing for anyone not using it. -->
      <div id="voice-bar" class="hidden">
        <div class="voice-row">
          <span id="voice-dot"></span>
          <span id="voice-status"></span>
          <button id="voice-unlock" class="hidden">Enable voice</button>
          <button id="voice-again" class="voice-sub hidden" title="Read the last turn again">&#8635;</button>
          <button id="voice-off" class="voice-sub hidden" title="Stop listening">&#10005;</button>
        </div>
        <!-- One line for both directions: 🔊 what was spoken, 🎤 what was heard
             (live, from interim results — seeing the words appear is how you
             know the mic is actually on). -->
        <div id="voice-heard" class="hidden"></div>
        <button id="voice-cancel" class="hidden">Cancel &mdash; sending in <span id="voice-count">3</span>s</button>
        <!-- Where an aborted utterance lands. Throwing the words away after the
             user managed to say "stop" in three seconds would be its own bug. -->
        <div id="voice-edit" class="hidden">
          <textarea id="voice-edit-text" rows="3" autocorrect="on" spellcheck="false"></textarea>
          <div class="voice-edit-actions">
            <button id="voice-edit-discard" class="secondary">Discard</button>
            <button id="voice-edit-send">Send</button>
          </div>
        </div>
      </div>

      <!-- On-screen keys (essential on phones; phone keyboards lack these).
           The keys scroll sideways when they don't fit (they don't, on a
           phone) — 🎤 and 📎 live OUTSIDE that scroller so they are always on
           screen, since a button you have to go looking for is no fix for
           "I can't attach a file" or "let me just say it". -->
      <div id="keybar">
        <div id="keybar-keys">
          <button data-key="esc" class="key">Esc</button>
          <button data-key="ctrl" class="key" id="ctrl-key">Ctrl</button>
          <button data-key="tab" class="key">Tab</button>
          <button data-key="left" class="key">&#8592;</button>
          <button data-key="up" class="key">&#8593;</button>
          <button data-key="down" class="key">&#8595;</button>
          <button data-key="right" class="key">&#8594;</button>
          <button data-key="ctrl-c" class="key wide">^C</button>
          <button id="paste-key" class="key" title="Paste from clipboard">Paste</button>
          <button id="kbd-key" class="key" title="Show keyboard">&#9000;</button>
        </div>
        <button id="mic-key" class="key" title="Talk to this session">&#127908;</button>
        <button id="attach-key" class="key" title="Attach a file">&#128206;</button>
      </div>

      <!-- The 📎 key's picker. No `accept` filter on purpose: iOS Safari hides
           the "Browse" (Files) option as soon as one is set, leaving only the
           photo library. -->
      <input id="file-input" type="file" multiple hidden />
    </main>
  </div>

  <!-- Upload progress / failure notices. Deliberately DOM, not terminal output:
       a full-screen TUI repaints over anything written into the terminal. -->
  <div id="toasts"></div>

  <!-- New terminal / Claude Code dialog -->
  <div id="dialog-backdrop" class="hidden">
    <div id="dialog">
      <h2 id="dialog-title">New terminal</h2>
      <label for="dlg-cwd">Directory <span class="hint">(blank = home)</span></label>
      <div class="combo">
        <input id="dlg-cwd" placeholder="~/projects/app" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <div class="combo-list" id="dlg-cwd-list" hidden></div>
      </div>
      <label for="dlg-cmd">Command <span class="hint">(type or pick; blank = just a shell)</span></label>
      <div class="combo">
        <input id="dlg-cmd" placeholder="claude --dangerously-skip-permissions" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <div class="combo-list" id="dlg-cmd-list" hidden></div>
      </div>
      <label for="dlg-title">Title <span class="hint">(optional)</span></label>
      <input id="dlg-title" placeholder="auto" autocomplete="off" />
      <div class="dialog-buttons">
        <button id="dlg-cancel" class="secondary">Cancel</button>
        <button id="dlg-open">Open</button>
      </div>
      <div id="dlg-error"></div>
    </div>
  </div>

  <!-- Update panel -->
  <div id="update-backdrop" class="hidden">
    <div id="update-dialog">
      <h2>Update termhub</h2>
      <div id="update-status">Checking…</div>
      <div id="update-commits"></div>
      <div class="dialog-buttons">
        <button id="update-close" class="secondary">Close</button>
        <button id="update-check" class="secondary">Check again</button>
        <button id="update-apply" disabled>Update now</button>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-webgl.js"></script>
  <script src="/app.js"></script>
</body>
</html>
