<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>agent time · termhub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315171c'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23f0b35a'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body class="dash">
  <header id="dash-head">
    <a id="back" href="/" title="Back to the terminals">‹ terminals</a>
    <h1>agent time</h1>
    <span id="dash-machine"></span>
  </header>

  <main id="dash-main">
    <!-- One card per machine, led by "all machines" — the sum across every
         reachable box. Picking a card points every panel below at it;
         /dashboard#all opens on the fleet. -->
    <section id="machines">
      <div id="machine-strip"></div>
      <button id="machine-scan" title="Find other machines on your tailnet running termhub">+ find machines</button>
    </section>

    <!-- Shown when the selected machine records nothing yet. Without it a
         machine with no tracking renders as 0% idle and "nothing ran", which
         reads as a perfect day rather than as a missing feature. -->
    <div id="dash-note" class="hidden"></div>

    <!-- The score: the day's agent time (summed over sessions, so parallel
         agents count in full). The ring's fill is the share of it spent
         working rather than waiting on you. -->
    <section id="score-card">
      <div id="score-ring">
        <div id="score-pct">—</div>
        <div id="score-label">agent time</div>
      </div>
      <div id="score-side">
        <div id="score-day">—</div>
        <div id="score-verdict"></div>
        <div id="score-streak"></div>
        <!-- Two weeks of agent time as bars. -->
        <div id="trend" title="Agent time, last 14 recorded days"></div>
      </div>
    </section>

    <section id="tiles"></section>

    <section class="panel">
      <div class="panel-head">
        <button id="cal-prev" title="Previous month">‹</button>
        <h2 id="cal-title">—</h2>
        <button id="cal-next" title="Next month">›</button>
      </div>
      <div id="calendar"></div>
      <div id="cal-legend">
        <span class="swatch a0"></span><span class="swatch a1"></span><span class="swatch a2"></span>
        <span class="swatch a3"></span><span class="swatch a4"></span>
        <span class="legend-text">&lt;1h → 10h+ agent time · click a day</span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>the day, session by session</h2></div>
      <div id="timeline"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>where the agent time went</h2></div>
      <div id="projects"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>sessions</h2></div>
      <div id="day-sessions"></div>
    </section>

    <div id="toast" class="hidden"></div>
  </main>

  <script src="/dashboard.js"></script>
</body>
</html>
