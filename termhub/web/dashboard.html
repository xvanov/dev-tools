<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>idle · termhub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315171c'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23f0b35a'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body class="dash">
  <header id="dash-head">
    <a id="back" href="/" title="Back to the terminals">‹ terminals</a>
    <h1>idle tracker</h1>
    <span id="dash-machine"></span>
  </header>

  <main id="dash-main">
    <!-- The score. Idle share is the honest headline: raw minutes punish a long
         day, and a ratio doesn't. -->
    <section id="score-card">
      <div id="score-ring">
        <div id="score-pct">—</div>
        <div id="score-label">idle share</div>
      </div>
      <div id="score-side">
        <div id="score-day">—</div>
        <div id="score-verdict"></div>
        <div id="score-streak"></div>
      </div>
    </section>

    <section id="tiles"></section>

    <section class="panel">
      <div class="panel-head">
        <button id="cal-prev" title="Previous month">‹</button>
        <h2 id="cal-title">—</h2>
        <button id="cal-next" title="Next month">›</button>
      </div>
      <div id="calendar"></div>
      <div id="cal-legend">
        <span class="swatch s0"></span><span class="swatch s1"></span><span class="swatch s2"></span>
        <span class="swatch s3"></span><span class="swatch s4"></span>
        <span class="legend-text">less idle → more idle · click a day</span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>the day, session by session</h2></div>
      <div id="timeline"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>sessions</h2></div>
      <div id="day-sessions"></div>
    </section>
  </main>

  <script src="/dashboard.js"></script>
</body>
</html>
